### MVP SFT config for 4x H20 96GB, intended to finish within a 24h end-to-end MVP run.
### This is not the paper full-scale 3000-step SFT setting.

### model
model_name_or_path: Qwen/Qwen3-4B-Base

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z0_config.json
enable_liger_kernel: true
packing: true

### dataset
dataset: openthoughts3_mvp20k_qwen3-8b
# Requires data/sft_data/openthoughts3_mvp20k_qwen3-8b.parquet.
template: qwen3
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_num_workers: 4

### output
logging_steps: 1
save_steps: 50
save_total_limit: 5
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none
run_name: qwen3-4b-base-open-thoughts3-qwen3-8b-mvp-h20

### train
# On 4 GPUs: global batch = 2 * 8 * 4 = 64.
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 8e-5
max_steps: 300
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
